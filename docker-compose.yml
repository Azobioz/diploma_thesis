services:

  # ─────────────── Инфраструктура ───────────────

  postgres:
    image: postgres:16-alpine
    container_name: boardiox-postgres
    environment:
      POSTGRES_DB: boardiox_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - boardiox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boardiox_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: boardiox-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - boardiox-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: boardiox-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - boardiox-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────── Backend-сервисы ───────────────

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: boardiox-account
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/boardiox_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
      - JWT_SECRET=313@#2!131#@309ff243@#32@#92gh9!12!3ff49-142@#39048190@#1234@#
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boardiox-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health 2>/dev/null || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  board-service:
    build:
      context: ./board_service
      dockerfile: Dockerfile
    container_name: boardiox-board
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/boardiox_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS=3000
      - LOGGING_LEVEL_ORG_APACHE_KAFKA=ERROR
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA=ERROR
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - boardiox-network
    restart: unless-stopped

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    container_name: boardiox-task
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/boardiox_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boardiox-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: boardiox-notification
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/boardiox_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LOGGING_LEVEL_ORG_APACHE_KAFKA=ERROR
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA=ERROR
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - boardiox-network
    restart: unless-stopped

  aggregator-service:
    build:
      context: ./aggregator-service
      dockerfile: Dockerfile
    container_name: boardiox-aggregator
    environment:
      - JWT_SECRET=313@#2!131#@309ff243@#32@#92gh9!12!3ff49-142@#39048190@#1234@#
      - SERVICES_ACCOUNT_URL=http://account-service:8084
      - SERVICES_BOARD_URL=http://board-service:8082
      - SERVICES_TASK_URL=http://task-service:8083
      - SERVICES_NOTIFICATION_URL=http://notification-service:8085
    ports:
      - "8081:8081"
    depends_on:
      - account-service
      - board-service
      - task-service
      - notification-service
    networks:
      - boardiox-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boardiox-frontend
    ports:
      - "3000:80"
    depends_on:
      - aggregator-service
    networks:
      - boardiox-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  boardiox-network:
    driver: bridge
